openapi: 3.0.0
info:
  title: Deadman API
  version: 1.0.0
paths:
  /api/changes:
    post:
      summary: Apply a change
      responses:
        '201':
          description: Created
  /api/changes/{id}:
    get:
      summary: Get status
      responses:
        '200':
          description: OK
  /api/changes/{id}/confirm:
    post:
      summary: Confirm a change
      responses:
        '200':
          description: OK
  /api/changes/{id}/revert:
    post:
      summary: Revert a change manually
      responses:
        '200':
          description: OK
