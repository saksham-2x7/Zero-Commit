openapi: 3.0.0
info:
  title: Deadman API
  version: "1.0"
servers:
  - url: /api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Op:
      type: object
      required: [action, protocol, from_port, to_port, cidr]
      properties:
        op_id:
          type: integer
        action:
          type: string
          enum: [AUTHORIZE, REVOKE]
        protocol:
          type: string
        from_port:
          type: integer
        to_port:
          type: integer
        cidr:
          type: string
        applied:
          type: boolean
          nullable: true
    RevertReportItem:
      type: object
      properties:
        op_id:
          type: integer
        result:
          type: string
          enum: [REVERTED, SKIPPED_ALREADY_SATISFIED, ERROR]
        detail:
          type: string
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            change_id:
              type: string
            status:
              type: string
security:
  - bearerAuth: []
paths:
  /changes:
    post:
      summary: Create a change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sg_id, ttl_seconds, ops]
              properties:
                sg_id:
                  type: string
                ttl_seconds:
                  type: integer
                ops:
                  type: array
                  items:
                    $ref: '#/components/schemas/Op'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  change_id:
                    type: string
                  status:
                    type: string
                  sg_id:
                    type: string
                  ttl_seconds:
                    type: integer
                  created_at:
                    type: integer
                  expires_at:
                    type: integer
                  server_time:
                    type: integer
                  schedule_name:
                    type: string
                  delta:
                    type: array
                    items:
                      $ref: '#/components/schemas/Op'
  /changes/{id}:
    get:
      summary: Get a change
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  change_id:
                    type: string
                  status:
                    type: string
                  sg_id:
                    type: string
                  ttl_seconds:
                    type: integer
                  created_at:
                    type: integer
                  expires_at:
                    type: integer
                  server_time:
                    type: integer
                  apply_done:
                    type: boolean
                  delta:
                    type: array
                    items:
                      $ref: '#/components/schemas/Op'
                  confirmed_at:
                    type: integer
                    nullable: true
                  reverted_at:
                    type: integer
                    nullable: true
                  revert_trigger:
                    type: string
                    nullable: true
                  revert_report:
                    type: array
                    items:
                      $ref: '#/components/schemas/RevertReportItem'
                    nullable: true
                  failure_reason:
                    type: string
                    nullable: true
  /changes/{id}/confirm:
    post:
      summary: Confirm a change
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  change_id:
                    type: string
                  status:
                    type: string
                  confirmed_at:
                    type: integer
                  idempotent:
                    type: boolean
  /changes/{id}/revert:
    post:
      summary: Revert a change manually
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  change_id:
                    type: string
                  status:
                    type: string
                  revert_trigger:
                    type: string
                  reverted_at:
                    type: integer
                  idempotent:
                    type: boolean
                  revert_report:
                    type: array
                    items:
                      $ref: '#/components/schemas/RevertReportItem'
